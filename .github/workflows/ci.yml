name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Guile
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0

      - name: Run tests
        run: make check
